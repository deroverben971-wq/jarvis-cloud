name: Validate JARVIS Standalone App

on:
  push:
    branches:
      - feature/standalone-multi-agent-core
    paths:
      - "standalone/app/**"
      - ".github/workflows/validate-standalone-app.yml"
  pull_request:
    paths:
      - "standalone/app/**"
      - ".github/workflows/validate-standalone-app.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Build frontend
        run: npm run build
