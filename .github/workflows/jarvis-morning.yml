name: JARVIS Morning Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send morning briefing to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret.")

          now = datetime.now(ZoneInfo("Asia/Manila"))
          text = (
              "🤖 JARVIS — Morning Briefing\n\n"
              f"📅 {now.strftime('%A, %d %B %Y')}\n"
              f"🕖 {now.strftime('%I:%M %p')} (Philippines time)\n\n"
              "✅ Cloud reminder workflow is running.\n"
              "ℹ️ This first version is a system check, not yet a calendar or AI-generated briefing."
          )
          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          payload = json.dumps({"chat_id": chat_id, "text": text}).encode()
          request = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              try:
                  details = json.loads(error.read().decode())
                  description = details.get("description", "No description")
              except Exception:
                  description = "Telegram returned an unreadable error response."
              raise SystemExit(f"Telegram rejected the request (HTTP {error.code}): {description}")
          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm delivery.")
          print("Morning briefing delivered.")
          PY
