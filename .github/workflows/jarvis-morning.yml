name: JARVIS Morning Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Build and send morning briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret.")

          now = datetime.now(ZoneInfo("Asia/Manila"))
          sections = [
              "🤖 JARVIS — SMART MORNING BRIEFING",
              f"📅 {now.strftime('%A, %d %B %Y')} · {now.strftime('%I:%M %p')} PHT",
              "",
          ]

          def fetch(url, timeout=10):
              req = urllib.request.Request(url, headers={"User-Agent": "JARVIS-Morning-Briefing/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          # Pasig City, Philippines; free Open-Meteo forecast API.
          try:
              raw = fetch(
                  "https://api.open-meteo.com/v1/forecast"
                  "?latitude=14.5764&longitude=121.0851"
                  "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code"
                  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
                  "&timezone=Asia%2FManila&forecast_days=1"
              )
              w = json.loads(raw)
              current = w.get("current", {})
              daily = w.get("daily", {})
              code = current.get("weather_code")
              labels = {
                  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
                  45: "Fog", 48: "Depositing rime fog", 51: "Light drizzle",
                  53: "Moderate drizzle", 55: "Dense drizzle", 61: "Light rain",
                  63: "Moderate rain", 65: "Heavy rain", 71: "Light snow",
                  80: "Rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
                  95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with heavy hail"
              }
              sections += [
                  "🌦️ WEATHER — PASIG CITY",
                  f"Now: {labels.get(code, 'Conditions code ' + str(code))} · {current.get('temperature_2m', 'N/A')}°C",
                  f"Feels like {current.get('apparent_temperature', 'N/A')}°C · Humidity {current.get('relative_humidity_2m', 'N/A')}%",
                  f"Today: {daily.get('temperature_2m_min', ['N/A'])[0]}–{daily.get('temperature_2m_max', ['N/A'])[0]}°C · Rain chance up to {daily.get('precipitation_probability_max', ['N/A'])[0]}%",
                  ""
              ]
          except Exception as e:
              print(f"Weather unavailable: {type(e).__name__}")
              sections += ["🌦️ WEATHER — PASIG CITY", "Weather data unavailable right now.", ""]

          # Free BBC World RSS; show headlines only, and clearly mark source.
          try:
              xml_data = fetch("https://feeds.bbci.co.uk/news/world/rss.xml")
              root = ET.fromstring(xml_data)
              items = root.findall("./channel/item")[:4]
              sections += ["📰 WORLD NEWS — BBC"]
              if items:
                  for item in items:
                      title = (item.findtext("title") or "").strip()
                      if title:
                          sections.append("• " + title[:220])
              else:
                  sections.append("No headlines were returned.")
              sections.append("")
          except Exception as e:
              print(f"News unavailable: {type(e).__name__}")
              sections += ["📰 WORLD NEWS", "Headlines unavailable right now.", ""]

          sections += [
              "🎯 TODAY'S FOCUS",
              "• Pick one important task to finish today.",
              "• Check your plans and reminders before starting.",
              "",
              "ℹ️ This weather/news briefing is separate from your JARVIS daily schedule message. Use /schedule and /calendar in Telegram to refresh them on demand."
          ]
          text = "\n".join(sections)
          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          payload = json.dumps({"chat_id": chat_id, "text": text, "disable_web_page_preview": True}).encode()
          request = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              try:
                  details = json.loads(error.read().decode())
                  description = details.get("description", "No description")
              except Exception:
                  description = "Telegram returned an unreadable error response."
              raise SystemExit(f"Telegram rejected the request (HTTP {error.code}): {description}")
          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm delivery.")
          print("Smart morning briefing delivered.")
          PY
