name: Build JARVIS Android Test APK

on:
  push:
    branches:
      - feature/standalone-multi-agent-core
    paths:
      - "standalone/app/**"
      - ".github/workflows/build-standalone-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: standalone/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install Android platform, build tools, NDK, and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Tauri Android project
        run: npm run android:init -- --ci --skip-targets-install

      - name: Add Android microphone permissions
        run: npm run android:prepare

      - name: Build debug APK for device testing
        run: npm run android:build -- --debug --target aarch64 --apk --ci

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-test-apk
          path: standalone/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 5
