name: Diagnose Cloudflare Worker API access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Worker metadata endpoints (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) {
            console.log("Missing Cloudflare credential or account variable; values were not printed.");
            process.exit(1);
          }

          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const checks = [
            ["worker_bindings", `/workers/services/jarvis-cloud-phase2/environments/production/bindings`],
            ["worker_routes", `/workers/services/jarvis-cloud-phase2/environments/production/routes?show_zonename=true`],
            ["worker_domains", `/workers/domains/records?page=0&per_page=5&service=jarvis-cloud-phase2&environment=production`],
            ["worker_subdomain", `/workers/services/jarvis-cloud-phase2/environments/production/subdomain`],
            ["worker_environment", `/workers/services/jarvis-cloud-phase2/environments/production`],
            ["worker_schedules", `/workers/scripts/jarvis-cloud-phase2/schedules`],
          ];

          for (const [name, path] of checks) {
            try {
              const response = await fetch(base + path, {
                method: "GET",
                headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
              });
              let payload = {};
              try { payload = await response.json(); } catch {}
              const errors = Array.isArray(payload.errors)
                ? payload.errors.map(e => ({
                    code: e.code ?? null,
                    message: String(e.message ?? "").replaceAll(token, "[REDACTED]").replaceAll(account, "[ACCOUNT_ID]")
                  }))
                : [];
              console.log(JSON.stringify({
                check: name,
                http_status: response.status,
                success: payload.success ?? null,
                errors
              }));
            } catch (error) {
              console.log(JSON.stringify({ check: name, network_error: String(error?.name ?? "Error") }));
            }
          }
          NODE
