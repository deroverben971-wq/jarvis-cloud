name: Validate JARVIS Cloud Phase 2

on:
  pull_request:
    paths:
      - "cloud-phase2/src/index.js"
      - "cloud-phase2/src/reminder-parser.mjs"
      - "cloud-phase2/tests/reminder-parser.test.mjs"
      - "cloud-phase2/wrangler.jsonc"
      - "cloud-phase2/google-calendar-apps-script.js"
      - "cloud-phase2/gmail-outreach-apps-script.js"
      - "cloud-phase2/gmail-outreach-appsscript.json"
      - "cloud-phase2/appsscript.json"
      - "cloud-phase2/schema.sql"
      - ".github/workflows/validate-cloud-phase2.yml"
      - ".github/workflows/deploy-cloud-phase2.yml"
  push:
    branches:
      - main
    paths:
      - "cloud-phase2/src/index.js"
      - "cloud-phase2/wrangler.jsonc"
      - "cloud-phase2/google-calendar-apps-script.js"
      - "cloud-phase2/gmail-outreach-apps-script.js"
      - "cloud-phase2/gmail-outreach-appsscript.json"
      - "cloud-phase2/schema.sql"
      - ".github/workflows/validate-cloud-phase2.yml"
      - ".github/workflows/deploy-cloud-phase2.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Wrangler JSON configuration
        run: python -m json.tool cloud-phase2/wrangler.jsonc > /dev/null
      - name: Check Worker JavaScript syntax
        run: |
          node --check cloud-phase2/src/index.js
          node --check cloud-phase2/src/reminder-parser.mjs
      - name: Test reminder parsing and Manila time handling
        run: node --test cloud-phase2/tests/reminder-parser.test.mjs
      - name: Check Google Apps Script JavaScript syntax
        run: |
          cp cloud-phase2/google-calendar-apps-script.js /tmp/google-calendar-apps-script.js
          node --check /tmp/google-calendar-apps-script.js
      - name: Validate Apps Script manifest JSON
        run: python -m json.tool cloud-phase2/appsscript.json > /dev/null
      - name: Check Gmail outreach Apps Script JavaScript syntax
        run: |
          cp cloud-phase2/gmail-outreach-apps-script.js /tmp/gmail-outreach-apps-script.js
          node --check /tmp/gmail-outreach-apps-script.js
      - name: Validate Gmail outreach Apps Script manifest JSON
        run: python -m json.tool cloud-phase2/gmail-outreach-appsscript.json > /dev/null
      - name: Validate D1 schema SQL with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path("cloud-phase2/schema.sql").read_text(encoding="utf-8")
          connection = sqlite3.connect(":memory:")
          connection.executescript(sql)
          connection.execute("SELECT name FROM sqlite_master WHERE type = 'table'").fetchall()
          print("D1 schema syntax passed.")
          PY
