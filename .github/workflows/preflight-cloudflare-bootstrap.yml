name: Preflight JARVIS Cloud Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloud-phase2/bootstrap-api-deploy.mjs'
      - 'cloud-phase2/src/index.js'
      - 'cloud-phase2/wrangler.jsonc'
      - '.github/workflows/preflight-cloudflare-bootstrap.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker and bootstrap script syntax
        run: |
          node --check cloud-phase2/src/index.js
          node --check cloud-phase2/bootstrap-api-deploy.mjs

      - name: Build the Worker bundle without deploying
        run: |
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/jarvis-cloud-dry-run --config cloud-phase2/wrangler.jsonc
          test -s /tmp/jarvis-cloud-dry-run/index.js

      - name: Run read-only Cloudflare bootstrap preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloud-phase2/bootstrap-api-deploy.mjs /tmp/jarvis-cloud-dry-run --check-only
