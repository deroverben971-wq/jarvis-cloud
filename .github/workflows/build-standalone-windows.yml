name: Build JARVIS Windows Installer

on:
  push:
    branches:
      - feature/standalone-multi-agent-core
    paths:
      - "standalone/app/**"
      - ".github/workflows/build-standalone-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: standalone/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installers
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-installers
          path: |
            standalone/app/src-tauri/target/release/bundle/nsis/*.exe
            standalone/app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 5
