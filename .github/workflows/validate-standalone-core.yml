name: Validate JARVIS Standalone Core

on:
  push:
    branches:
      - feature/standalone-multi-agent-core
    paths:
      - "standalone/**"
      - ".github/workflows/validate-standalone-core.yml"
  pull_request:
    paths:
      - "standalone/**"
      - ".github/workflows/validate-standalone-core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run standalone core tests
        working-directory: standalone/worker
        run: npm test
